<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIRVANA | MISSION CONTROL</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --spacex-white: #ffffff;
            --spacex-black: #000000;
            --spacex-grey: #1a1a1a;
            --accent: #005288; /* SpaceX Blue */
            --glass: rgba(0, 0, 0, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--spacex-black);
            color: var(--spacex-white);
            font-family: 'Barlow Condensed', sans-serif;
            height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* Cinematic Background */
        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.9)), 
                        url('https://sxcontent999.azureedge.net/cms-assets/assets/Eutelsat_36_D_Pre_Launch_9_75997f6424.jpg');
            background-size: cover;
            background-position: center;
            filter: grayscale(20%);
        }

        /* Layout Grid */
        .ui-wrapper {
            display: grid;
            grid-template-columns: 400px 1fr;
            grid-template-rows: 100px 1fr 120px;
            height: 100vh;
            padding: 40px;
            gap: 20px;
        }

        /* --- HEADER --- */
        header {
            grid-column: 1 / -1;
            display: flex;
            align-items: flex-end;
            border-bottom: 2px solid var(--spacex-white);
            padding-bottom: 10px;
        }

        header h1 { font-size: 4rem; letter-spacing: 12px; font-weight: 700; line-height: 0.8; }
        .mission-status { margin-left: auto; text-align: right; font-size: 0.9rem; letter-spacing: 2px; }

        /* --- LEFT: MANIFEST (Tracklist) --- */
        .manifest {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
            padding: 20px 0;
        }

        .track-row {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .track-row:hover { background: var(--spacex-white); color: var(--spacex-black); }
        .track-row.active { border-left: 5px solid var(--spacex-white); background: rgba(255,255,255,0.1); }

        .track-id { font-weight: 200; opacity: 0.5; width: 30px; }
        .track-name { font-size: 1.2rem; font-weight: 400; letter-spacing: 1px; }

        /* --- CENTER: TELEMETRY (Visualizer) --- */
        .telemetry {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 20px;
        }

        #visualizer { width: 100%; height: 200px; }

        /* --- FOOTER: CONTROLS --- */
        .controls {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            background: var(--spacex-white);
            color: var(--spacex-black);
            padding: 0 40px;
        }

        .playback-info { flex: 1; }
        .playback-info h2 { font-size: 2rem; letter-spacing: 2px; }

        .btn-group { display: flex; gap: 30px; }
        .btn-spacex {
            background: none;
            border: 2px solid var(--spacex-black);
            padding: 10px 30px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-spacex:hover { background: var(--spacex-black); color: var(--spacex-white); }

        /* Scrollbar */
        .manifest::-webkit-scrollbar { width: 4px; }
        .manifest::-webkit-scrollbar-thumb { background: var(--spacex-white); }
    </style>
</head>
<body>

<div class="hero-bg"></div>

<div class="ui-wrapper">
    <header>
        <h1>NIRVANA</h1>
        <div class="mission-status">
            <div>CORE: C++_POSIX_SERVER [ACTIVE]</div>
            <div id="clock">T+ 00:00:00</div>
        </div>
    </header>

    <div class="manifest" id="tracklist">
        </div>

    <div class="telemetry">
        <canvas id="visualizer"></canvas>
    </div>

    <footer class="controls">
        <div class="playback-info">
            <div style="font-size: 0.8rem; opacity: 0.6;">Current Payload</div>
            <h2 id="nowPlaying">SYSTEM_IDLE</h2>
        </div>
        
        <div class="btn-group">
            <button class="btn-spacex" onclick="togglePlay()">PLAY / PAUSE</button>
            <button class="btn-spacex" onclick="downloadCurrent()">DOWNLOAD DATA</button>
        </div>
    </footer>
</div>

<audio id="audioEngine"></audio>

<script>
    const audio = document.getElementById('audioEngine');
    const visualizer = document.getElementById('visualizer');
    const ctx = visualizer.getContext('2d');
    let audioCtx, analyser, dataArray;
    let songs = [];

    async function init() {
        const res = await fetch('/api/songs');
        const data = await res.json();
        songs = data.songs;
        const list = document.getElementById('tracklist');
        
        songs.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = 'track-row';
            div.innerHTML = `<span class="track-id">0${i+1}</span><span class="track-name">${s.name}</span>`;
            div.onclick = () => playLaunch(s.id, s.name, div);
            list.appendChild(div);
        });
    }

    function setupAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 128;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        renderFrame();
    }

    function renderFrame() {
        requestAnimationFrame(renderFrame);
        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, visualizer.width, visualizer.height);
        
        const barWidth = (visualizer.width / dataArray.length) * 2;
        let x = 0;
        for(let i = 0; i < dataArray.length; i++) {
            let barHeight = dataArray[i] / 2;
            ctx.fillStyle = `rgba(255, 255, 255, ${dataArray[i]/255})`;
            ctx.fillRect(x, visualizer.height - barHeight, barWidth - 2, barHeight);
            x += barWidth;
        }
    }

    function playLaunch(id, name, el) {
        setupAudio();
        document.querySelectorAll('.track-row').forEach(r => r.classList.remove('active'));
        el.classList.add('active');
        
        audio.src = `/api/play/${id}`;
        audio.play();
        document.getElementById('nowPlaying').textContent = name;
    }

    function togglePlay() { audio.paused ? audio.play() : audio.pause(); }

    // Mission Clock Logic
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').textContent = `T+ ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
    }, 1000);

    init();
</script>
</body>
</html>
