<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUDIO SYSTEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Barlow:wght@100;200;300;400;600;700;900&family=Barlow+Condensed:wght@100;200;300;400;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #080808;
  --bg2: #0e0e0e;
  --line: rgba(255,255,255,0.07);
  --line-bright: rgba(255,255,255,0.15);
  --text: #f2f0eb;
  --muted: rgba(242,240,235,0.35);
  --faint: rgba(242,240,235,0.12);
  --accent: #e8e0d0;
  --live: #c8f0b0;
  --warn: #f0c890;
  --danger: #f08080;
  --mono: 'DM Mono', monospace;
  --sans: 'Barlow', sans-serif;
  --cond: 'Barlow Condensed', sans-serif;
}

html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  display: grid;
  grid-template-rows: 48px 1fr 1px 120px;
  grid-template-columns: 1fr 480px;
  height: 100vh;
  cursor: none;
}

/* custom cursor */
#cursor {
  position: fixed;
  width: 6px; height: 6px;
  background: var(--text);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: transform 0.1s, width 0.15s, height 0.15s;
  mix-blend-mode: difference;
}
#cursor.big { width: 40px; height: 40px; }

/* ── TOP BAR ── */
#topbar {
  grid-column: 1 / -1;
  grid-row: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  border-bottom: 1px solid var(--line);
}
.tb-left {
  display: flex;
  align-items: center;
  gap: 28px;
}
.wordmark {
  font-family: var(--cond);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--text);
}
.tb-tag {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 3px 8px;
  border: 1px solid var(--line-bright);
}
.tb-tag.live { color: var(--live); border-color: rgba(200,240,176,0.3); }
#tb-clock {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
}

/* ── MAIN STAGE (left column) ── */
#stage {
  grid-column: 1;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 40px 48px 32px;
  overflow: hidden;
  position: relative;
  border-right: 1px solid var(--line);
}

/* giant track title */
#big-title-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
}
#big-index {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
#big-title {
  font-family: var(--cond);
  font-weight: 900;
  font-size: clamp(52px, 8vw, 96px);
  line-height: 0.95;
  text-transform: uppercase;
  letter-spacing: -1px;
  color: var(--text);
  word-break: break-word;
  transition: opacity 0.3s;
}
#big-title.fade { opacity: 0; }

/* disc */
#disc-wrap {
  position: absolute;
  right: -60px;
  top: 50%;
  transform: translateY(-50%);
  width: 260px;
  height: 260px;
  opacity: 0.06;
  pointer-events: none;
}
#disc {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 1px solid var(--text);
  position: relative;
  animation: spin 6s linear infinite;
  animation-play-state: paused;
}
#disc.spinning { animation-play-state: running; }
#disc::before {
  content: '';
  position: absolute;
  inset: 12px;
  border-radius: 50%;
  border: 1px solid var(--text);
}
#disc::after {
  content: '';
  position: absolute;
  inset: 30px;
  border-radius: 50%;
  border: 1px solid var(--text);
}
.disc-groove {
  position: absolute;
  border-radius: 50%;
  border: 1px solid var(--text);
}
.disc-hole {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--text);
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* waveform */
#vis-wrap {
  height: 56px;
  display: flex;
  align-items: flex-end;
  gap: 2px;
  margin-bottom: 4px;
}
#vis-canvas { display: block; width: 100%; height: 56px; }

/* progress */
#progress-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 0;
}
#progress-track {
  flex: 1;
  height: 1px;
  background: var(--line-bright);
  cursor: pointer;
  position: relative;
}
#progress-head {
  height: 100%;
  background: var(--text);
  width: 0%;
  pointer-events: none;
}
#progress-thumb {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%) scale(0);
  width: 10px; height: 10px;
  background: var(--text);
  border-radius: 50%;
  left: 0%;
  transition: transform 0.15s;
  pointer-events: none;
}
#progress-track:hover #progress-thumb { transform: translate(-50%, -50%) scale(1); }
.time-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
  min-width: 36px;
}
#time-dur { text-align: right; }

/* ── TRACKLIST (right column) ── */
#tracklist-col {
  grid-column: 2;
  grid-row: 2;
  overflow-y: auto;
  scrollbar-width: none;
}
#tracklist-col::-webkit-scrollbar { display: none; }

.tl-header {
  padding: 20px 28px 12px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
.tl-title {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
}
#tl-count {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 1px;
}

.track {
  display: grid;
  grid-template-columns: 40px 1fr auto auto;
  align-items: center;
  padding: 0 28px;
  height: 52px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background 0.12s;
  position: relative;
  gap: 4px;
}
.track:hover { background: rgba(255,255,255,0.03); }
.track.active { background: rgba(255,255,255,0.04); }
.track.active::after {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--text);
}

.t-num {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
  letter-spacing: 1px;
}
.track.active .t-num { color: var(--live); }

.t-name {
  font-family: var(--sans);
  font-weight: 300;
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.2px;
}
.track.active .t-name { font-weight: 400; }

.t-action {
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--faint);
  padding: 6px 8px;
  text-transform: uppercase;
  transition: color 0.15s;
}
.t-action:hover { color: var(--text); }
.t-action.dl:hover { color: var(--live); }

.loading-row {
  padding: 32px 28px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ── DIVIDER ── */
#divider { grid-column: 1 / -1; grid-row: 3; background: var(--line); }

/* ── CONTROL BAR ── */
#controls {
  grid-column: 1 / -1;
  grid-row: 4;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 48px;
  gap: 40px;
  border-top: 1px solid var(--line);
}

.ctrl-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.ctrl-center {
  display: flex;
  align-items: center;
  gap: 12px;
}
.ctrl-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 20px;
}

.c-btn {
  background: none;
  border: 1px solid var(--line-bright);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 8px 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.c-btn:hover { border-color: var(--text); color: var(--text); }
.c-btn.on { border-color: var(--live); color: var(--live); }

#btn-playpause {
  font-family: var(--cond);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 4px;
  padding: 12px 36px;
  border-color: rgba(255,255,255,0.25);
  color: var(--text);
  transition: all 0.15s;
}
#btn-playpause:hover {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

.vol-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}
.vol-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 2px;
}
#vol-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 80px;
  height: 1px;
  background: var(--line-bright);
  outline: none;
  cursor: pointer;
}
#vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 8px; height: 8px;
  background: var(--text);
  border-radius: 50%;
  cursor: pointer;
}
#vol-num {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--muted);
  min-width: 24px;
  letter-spacing: 1px;
}

/* status chip */
#status-chip {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 4px 10px;
  border: 1px solid var(--line);
  white-space: nowrap;
}
#status-chip.playing { color: var(--live); border-color: rgba(200,240,176,0.25); }
#status-chip.error { color: var(--danger); border-color: rgba(240,128,128,0.25); }

/* lyrics overlay */
#lyrics-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8,8,8,0.96);
  z-index: 100;
  display: none;
  flex-direction: column;
  padding: 60px;
  overflow-y: auto;
}
#lyrics-overlay.open { display: flex; }
#lyrics-close {
  position: fixed;
  top: 24px; right: 40px;
  background: none;
  border: 1px solid var(--line-bright);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 2px;
  padding: 8px 16px;
  cursor: pointer;
  text-transform: uppercase;
}
#lyrics-close:hover { color: var(--text); border-color: var(--text); }
#lyrics-song-name {
  font-family: var(--cond);
  font-weight: 900;
  font-size: clamp(36px, 5vw, 64px);
  text-transform: uppercase;
  letter-spacing: -1px;
  margin-bottom: 40px;
  color: var(--text);
}
#lyrics-body {
  font-family: var(--mono);
  font-size: 14px;
  line-height: 2.2;
  color: rgba(242,240,235,0.6);
  white-space: pre-wrap;
  max-width: 640px;
}

/* page load animation */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
#big-title-wrap { animation: fadeUp 0.6s ease both; }
#stage { animation: fadeUp 0.4s ease both; }
</style>
</head>
<body>

<div id="cursor"></div>

<!-- TOP BAR -->
<header id="topbar">
  <div class="tb-left">
    <span class="wordmark">Audio System</span>
    <span class="tb-tag live" id="live-tag">LIVE</span>
    <span class="tb-tag" id="tb-codec">HTTP / REST</span>
  </div>
  <span id="tb-clock">--:--:--</span>
</header>

<!-- STAGE -->
<main id="stage">
  <div id="disc-wrap">
    <div id="disc">
      <div class="disc-groove" style="inset:50px"></div>
      <div class="disc-groove" style="inset:68px"></div>
      <div class="disc-groove" style="inset:86px"></div>
      <div class="disc-groove" style="inset:104px"></div>
      <div class="disc-hole"></div>
    </div>
  </div>

  <div id="big-title-wrap">
    <div id="big-index">SELECT TRACK</div>
    <div id="big-title">STANDBY</div>
  </div>

  <div>
    <canvas id="vis-canvas" height="56"></canvas>
    <div style="height:16px"></div>
    <div id="progress-row">
      <span class="time-label" id="time-cur">0:00</span>
      <div id="progress-track">
        <div id="progress-head"></div>
        <div id="progress-thumb"></div>
      </div>
      <span class="time-label" id="time-dur">0:00</span>
    </div>
  </div>
</main>

<!-- TRACKLIST -->
<aside id="tracklist-col">
  <div class="tl-header">
    <span class="tl-title">Tracklist</span>
    <span id="tl-count">—</span>
  </div>
  <div id="track-rows">
    <div class="loading-row">Fetching tracklist...</div>
  </div>
</aside>

<div id="divider"></div>

<!-- CONTROLS -->
<footer id="controls">
  <div class="ctrl-left">
    <div id="status-chip">STANDBY</div>
  </div>
  <div class="ctrl-center">
    <button class="c-btn" id="btn-prev" onclick="step(-1)">PREV</button>
    <button class="c-btn" id="btn-playpause" onclick="togglePlay()">PLAY</button>
    <button class="c-btn" id="btn-next" onclick="step(1)">NEXT</button>
  </div>
  <div class="ctrl-right">
    <button class="c-btn" id="btn-loop" onclick="toggleLoop()">LOOP</button>
    <button class="c-btn" id="btn-shuf" onclick="toggleShuffle()">SHUF</button>
    <div class="vol-wrap">
      <span class="vol-label">VOL</span>
      <input type="range" id="vol-slider" min="0" max="100" value="80" step="1">
      <span id="vol-num">80</span>
    </div>
  </div>
</footer>

<!-- LYRICS OVERLAY -->
<div id="lyrics-overlay">
  <button id="lyrics-close" onclick="closeLyrics()">CLOSE</button>
  <div id="lyrics-song-name"></div>
  <div id="lyrics-body"></div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
// ── STATE
const audio = document.getElementById('audio');
let songs = [], currentIdx = -1, loopOn = false, shuffleOn = false;
let isPlaying = false;
let audioCtx, analyser, srcNode, freqData;

// ── CURSOR
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
});
document.addEventListener('mouseenter', e => {
  if (e.target.tagName === 'BUTTON' || e.target.classList.contains('track')) cursor.classList.add('big');
});
document.addEventListener('mouseleave', e => {
  if (e.target.tagName === 'BUTTON' || e.target.classList.contains('track')) cursor.classList.remove('big');
}, true);

// ── CLOCK
function tickClock() {
  const now = new Date();
  document.getElementById('tb-clock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0') + ':' +
    String(now.getSeconds()).padStart(2,'0');
}
tickClock(); setInterval(tickClock, 1000);

// ── AUDIO CONTEXT + VISUALIZER
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 128;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  srcNode = audioCtx.createMediaElementSource(audio);
  srcNode.connect(analyser);
  analyser.connect(audioCtx.destination);
}

const visCanvas = document.getElementById('vis-canvas');
const vc = visCanvas.getContext('2d');
function drawVis() {
  requestAnimationFrame(drawVis);
  const W = visCanvas.offsetWidth, H = 56;
  visCanvas.width = W;
  vc.clearRect(0, 0, W, H);
  if (!analyser) {
    // idle lines
    const n = 64, bw = (W / n) - 1;
    for (let i = 0; i < n; i++) {
      vc.fillStyle = 'rgba(242,240,235,0.06)';
      vc.fillRect(i * (bw + 1), H - 2, bw, 2);
    }
    return;
  }
  analyser.getByteFrequencyData(freqData);
  const n = freqData.length, bw = (W / n) - 1;
  for (let i = 0; i < n; i++) {
    const v = freqData[i] / 255;
    const bh = Math.max(2, v * H);
    vc.fillStyle = `rgba(242,240,235,${0.1 + v * 0.9})`;
    vc.fillRect(i * (bw + 1), H - bh, bw, bh);
  }
}
drawVis();

// ── LOAD
async function loadSongs() {
  try {
    const res = await fetch('/api/songs');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    songs = data.songs;
    document.getElementById('tl-count').textContent = songs.length + ' tracks';
    renderTracks();
    setStatus('STANDBY', '');
  } catch(e) {
    document.getElementById('track-rows').innerHTML =
      '<div class="loading-row" style="color:rgba(240,128,128,0.7)">ERROR: ' + e.message + '</div>';
    setStatus('ERROR', 'error');
  }
}

function renderTracks() {
  const container = document.getElementById('track-rows');
  container.innerHTML = '';
  songs.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'track';
    row.id = 'tr-' + i;
    row.innerHTML =
      '<span class="t-num">' + String(i+1).padStart(2,'0') + '</span>' +
      '<span class="t-name" title="' + s.name + '">' + s.name + '</span>' +
      '<button class="t-action" onclick="event.stopPropagation();fetchLyrics(' + i + ')">LRC</button>' +
      '<button class="t-action dl" onclick="event.stopPropagation();doDownload(' + s.id + ',\'' + s.mp3 + '\')">DL</button>';
    row.addEventListener('click', () => playIdx(i));
    row.addEventListener('mouseenter', () => cursor.classList.add('big'));
    row.addEventListener('mouseleave', () => cursor.classList.remove('big'));
    container.appendChild(row);
  });
}

// ── PLAY
function playIdx(i) {
  if (i < 0 || i >= songs.length) return;
  currentIdx = i;
  const s = songs[i];

  document.querySelectorAll('.track').forEach((r, idx) => {
    r.classList.remove('active');
    r.querySelector('.t-num').textContent = String(idx+1).padStart(2,'0');
  });
  const row = document.getElementById('tr-' + i);
  if (row) {
    row.classList.add('active');
    row.querySelector('.t-num').textContent = '▶';
    row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // animate title swap
  const bigTitle = document.getElementById('big-title');
  bigTitle.classList.add('fade');
  setTimeout(() => {
    bigTitle.textContent = s.name.toUpperCase();
    document.getElementById('big-index').textContent =
      'TRACK ' + String(i+1).padStart(2,'0') + ' / ' + String(songs.length).padStart(2,'0');
    bigTitle.classList.remove('fade');
  }, 280);

  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  audio.src = '/api/play/' + s.id;
  audio.volume = document.getElementById('vol-slider').value / 100;
  audio.play().then(() => {
    isPlaying = true;
    document.getElementById('btn-playpause').textContent = 'PAUSE';
    document.getElementById('disc').classList.add('spinning');
    document.getElementById('disc-wrap').style.opacity = '0.12';
    setStatus('PLAYING', 'playing');
    document.getElementById('live-tag').style.display = '';
    closeLyrics();
  }).catch(() => setStatus('ERROR', 'error'));
}

function togglePlay() {
  if (currentIdx === -1 && songs.length) { playIdx(0); return; }
  if (audio.paused) {
    audio.play();
    isPlaying = true;
    document.getElementById('btn-playpause').textContent = 'PAUSE';
    document.getElementById('disc').classList.add('spinning');
    setStatus('PLAYING', 'playing');
  } else {
    audio.pause();
    isPlaying = false;
    document.getElementById('btn-playpause').textContent = 'PLAY';
    document.getElementById('disc').classList.remove('spinning');
    setStatus('PAUSED', '');
  }
}

function step(dir) {
  let next;
  if (shuffleOn) {
    next = Math.floor(Math.random() * songs.length);
  } else {
    next = currentIdx + dir;
    if (next < 0) next = songs.length - 1;
    if (next >= songs.length) next = 0;
  }
  playIdx(next);
}

function toggleLoop() {
  loopOn = !loopOn;
  audio.loop = loopOn;
  document.getElementById('btn-loop').classList.toggle('on', loopOn);
}
function toggleShuffle() {
  shuffleOn = !shuffleOn;
  document.getElementById('btn-shuf').classList.toggle('on', shuffleOn);
}

// ── AUDIO EVENTS
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  document.getElementById('progress-head').style.width = pct + '%';
  document.getElementById('progress-thumb').style.left = pct + '%';
  document.getElementById('time-cur').textContent = fmt(audio.currentTime);
  document.getElementById('time-dur').textContent = fmt(audio.duration);
});

audio.addEventListener('ended', () => {
  if (!loopOn) {
    isPlaying = false;
    document.getElementById('btn-playpause').textContent = 'PLAY';
    document.getElementById('disc').classList.remove('spinning');
    if (currentIdx < songs.length - 1) {
      step(1);
    } else {
      setStatus('END', '');
    }
  }
});

audio.addEventListener('error', () => {
  isPlaying = false;
  document.getElementById('btn-playpause').textContent = 'PLAY';
  document.getElementById('disc').classList.remove('spinning');
  setStatus('ERROR', 'error');
});

// ── PROGRESS SEEK
document.getElementById('progress-track').addEventListener('click', e => {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
});

// ── VOLUME
document.getElementById('vol-slider').addEventListener('input', e => {
  audio.volume = e.target.value / 100;
  document.getElementById('vol-num').textContent = e.target.value;
});

// ── LYRICS
async function fetchLyrics(i) {
  const s = songs[i];
  try {
    const res = await fetch('/lyrics/' + s.id);
    if (!res.ok) throw new Error('Not available');
    const text = await res.text();
    document.getElementById('lyrics-song-name').textContent = s.name.toUpperCase();
    document.getElementById('lyrics-body').textContent = text;
  } catch(e) {
    document.getElementById('lyrics-song-name').textContent = s.name.toUpperCase();
    document.getElementById('lyrics-body').textContent = '// No lyrics available for this track.';
  }
  document.getElementById('lyrics-overlay').classList.add('open');
}
function closeLyrics() {
  document.getElementById('lyrics-overlay').classList.remove('open');
}

function doDownload(id, name) {
  window.location.href = '/download/' + id;
  setStatus('DL: ' + name, '');
}

// ── KEYBOARD
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') step(1);
  if (e.code === 'ArrowLeft') step(-1);
  if (e.code === 'KeyL') toggleLoop();
  if (e.code === 'KeyS') toggleShuffle();
  if (e.code === 'Escape') closeLyrics();
});

// ── UTILS
function fmt(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2,'0');
}
function setStatus(msg, cls) {
  const chip = document.getElementById('status-chip');
  chip.textContent = msg;
  chip.className = 'c-btn' === chip.className ? '' : '';
  chip.setAttribute('class', 'status-chip' + (cls ? ' ' + cls : ''));
  // reset id
  chip.id = 'status-chip';
}

loadSongs();
</script>
